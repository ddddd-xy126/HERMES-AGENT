  [bold #00f0ff]██║  ██║██╔════╝██╔══██╗████╗ ████║██╔════╝██╔════╝[/]
  [bold #00d8ff]███████║█████╗  ██████╔╝██╔████╔██║█████╗  ███████╗[/]
  [bold #ff2a6d]██╔══██║██╔══╝  ██╔══██╗██║╚██╔╝██║██╔══╝  ╚════██║[/]
